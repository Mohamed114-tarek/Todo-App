<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Todo List</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Space+Grotesk:wght@300..700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body>
    <main>
      <h1 class="main-heading">ToDo List</h1>
      <form class="main-form">
        <input
          autocomplete="off"
          id="input-main"
          type="text"
          class="main-form__input"
          placeholder="Write Your Task..."
        />
        <input type="submit" value="Add" class="main-form__btn" />
      </form>
      <ul class="main-list">
        <h1>Add New Task</h1>
      </ul>
    </main>
    <script src="main.js"></script>
  </body>
</html>
